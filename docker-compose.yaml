services:
  clickhouse:
    image: hub.hamdocker.ir/clickhouse/clickhouse-server:24.8
    container_name: my-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol (Go driver uses this)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/default-user.xml:ro

volumes:
  clickhouse_data: